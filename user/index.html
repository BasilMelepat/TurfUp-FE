<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b3d1c" />
    <title>TurfUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      #splash{position:fixed;inset:0;z-index:100;background:#0b3d1c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;transition:opacity .45s,visibility .45s}
      #splash.out{opacity:0;visibility:hidden}
      #splash img{width:72px;height:72px;border-radius:50%}
      #splash b{font:700 38px "Barlow Condensed",sans-serif;letter-spacing:.01em}
      #splash .bw{height:78px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
      #splash .ball{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9d9d9 60%,#999)}
      #splash .sh{width:26px;height:6px;border-radius:50%;background:#0006;margin-top:4px}
      #splash .pb{width:160px;height:4px;border-radius:4px;background:#ffffff26;overflow:hidden}
      #splash .pb i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#4ade80,#0b8a33);border-radius:4px}
      @media(prefers-reduced-motion:no-preference){
        #splash .ball{animation:sb .65s cubic-bezier(.4,0,1,1) infinite alternate-reverse}
        #splash .sh{animation:ss .65s ease-in infinite alternate}
        #splash .pb i{animation:sp 1.1s ease-in-out infinite}
        #splash img{animation:si 1.6s ease-in-out infinite}
        @keyframes sb{to{transform:translateY(-46px)}}
        @keyframes ss{to{transform:scaleX(.5);opacity:.25}}
        @keyframes sp{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
        @keyframes si{50%{transform:scale(1.08)}}
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading TurfUp">
      <img src="/logo.png" alt="" width="72" height="72" />
      <b>TurfUp</b>
      <div class="bw"><div class="ball"></div><div class="sh"></div></div>
      <div class="pb"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
